services:
  - type: web
    name: vieteats-ai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CLIENT_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@vieteats.ai
      - key: SEED_ADMIN_PASSWORD
        value: Admin@123
      - key: SEED_USER_EMAIL
        value: demo@vieteats.ai
      - key: SEED_USER_PASSWORD
        value: Demo@123
